name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Tạo GitHub Release để tải trực tiếp (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (Full History for Dynamic Changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: false

      - name: Setup Android SDK & Accept All Licenses
        run: |
          # Detect Android SDK root
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          # Add SDK tools to PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          # Pre-accept all standard Android SDK licenses
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n24333f8a63061b1290586ac4e1419e6750add54b\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n89337d0207f9f1e1684c7987150e609e5b9330f1\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "859f317696f67ef3d7f30a50a5560e7834b43903\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          printf "601085b94cd77f0b54ff86406957099ebe79c4d6\n601085b94cd77f0b54ff86406957099fed7926e4\n" > "$ANDROID_HOME/licenses/android-googletv-license"
          printf "ceff83576aac4f7f37cb98fe189e9fb3c49d3b81\n" > "$ANDROID_HOME/licenses/android-googlexr-license"
          printf "e9acab5b5fbb560a72cfaecce8946896ff6aab9d\n" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          printf "33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$ANDROID_HOME/licenses/google-gdk-license"

          # Run sdkmanager to accept licenses and install SDK 36 and 36.1 components
          SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDK_MGR" ]; then
            SDK_MGR=$(which sdkmanager || true)
          fi
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses || true
            "$SDK_MGR" --install "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" "platform-tools" || true
          fi

      - name: Prepare Keystore and Environment
        run: |
          # 1. Đảm bảo file .env tồn tại cho Secrets Gradle Plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
              echo "Created .env from .env.example"
            else
              touch .env
              echo "Created empty .env"
            fi
          fi

          # 2. Khôi phục debug.keystore cố định đồng nhất 100% giữa mọi bản build (tránh lỗi "Gói xung đột với một gói hiện có" khi cập nhật đè)
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ] && [ -s "debug.keystore.base64" ]; then
              python3 -c "import base64; open('debug.keystore', 'wb').write(base64.b64decode(open('debug.keystore.base64').read().strip()))" 2>/dev/null || true
            fi
          fi

          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Restoring fixed project debug.keystore for seamless APK updates..."
            FIXED_KEYSTORE_B64=""
            python3 -c "import base64; open('debug.keystore', 'wb').write(base64.b64decode('$FIXED_KEYSTORE_B64'))"
          fi

          chmod 644 debug.keystore || true
          echo "Keystore verified successfully:"
          ls -l debug.keystore

          # 3. Đảm bảo default_web_client_id luôn có mặt để tránh lỗi Unresolved reference trên CI
          mkdir -p app/src/main/res/values
          if [ ! -f "app/src/main/res/values/default_web_client.xml" ]; then
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="default_web_client_id" translatable="false">placeholder_web_client_id.apps.googleusercontent.com</string>\n</resources>\n' > app/src/main/res/values/default_web_client.xml
            echo "Created fallback default_web_client.xml"
          fi

      - name: Make Gradlew Executable
        run: |
          if [ -f "./gradlew" ]; then
            sed -i 's/\r$//' ./gradlew || true
            chmod +x ./gradlew || true
          fi

      - name: Build APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace
          else
            gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace
          fi

      - name: Prepare APK and Extract Dynamic Changelog for Release
        id: release_info
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-output
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ ! -f "$APK_FILE" ]; then
            echo "Error: APK file not found!"
            find app/build/ -name "*.apk" || true
            exit 1
          fi

          # Extract versionName and versionCode from app/build.gradle.kts
          APP_VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "1.2.0")
          APP_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/' || echo "3")
          [ -z "$APP_VER" ] && APP_VER="1.2.0"
          [ -z "$APP_CODE" ] && APP_CODE="3"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="CloudPlay Xbox ${TAG} (Build #${APP_CODE})"
          else
            TAG="v${APP_VER}-b${{ github.run_number }}"
            TITLE="CloudPlay Xbox v${APP_VER} (Build #${{ github.run_number }})"
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "release_name=$TITLE" >> $GITHUB_OUTPUT

          APK_TAGGED_NAME="CloudPlay-Xbox-${TAG}.apk"
          APK_VER_NAME="CloudPlay-Xbox-v${APP_VER}.apk"
          cp "$APK_FILE" "release-output/${APK_TAGGED_NAME}"
          cp "$APK_FILE" "release-output/${APK_VER_NAME}"
          cp "$APK_FILE" "release-output/app-debug.apk"
          ls -lh release-output/

          APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
          APK_SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          BUILD_DATE=$(TZ='Asia/Ho_Chi_Minh' date '+%d/%m/%Y %H:%M:%S (GMT+7)')
          LATEST_HASH=$(git rev-parse --short HEAD)

          # 1. Extract the latest update section from CHANGELOG.md (between first "## [" and "---" or next "## [")
          CHANGELOG_LATEST=""
          if [ -f "CHANGELOG.md" ]; then
            CHANGELOG_LATEST=$(awk '
              /^## \[/ {
                if (found) exit;
                found=1;
                print;
                next;
              }
              found {
                if (/^---$/) exit;
                print;
              }
            ' CHANGELOG.md)
          fi

          # 2. Compare with previous tag or previous commit for code statistics and commit log
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n 1 || true)
          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            COMMIT_RANGE="${PREV_TAG}..HEAD"
            COMPARE_SUBTITLE="So sánh mã nguồn từ bản **${PREV_TAG}** ➔ **${TAG}**"
            DIFF_STAT=$(git diff --stat "${PREV_TAG}" HEAD | tail -n 1 || true)
            CHANGED_FILES=$(git diff --name-only "${PREV_TAG}" HEAD | head -n 25 | sed 's/^/- `/;s/$/`/' || true)
          else
            COMMIT_RANGE="-n 10 HEAD"
            COMPARE_SUBTITLE="Thống kê commit & file cập nhật trong bản **${TAG}**"
            DIFF_STAT=$(git show --stat --oneline HEAD | tail -n 1 || true)
            CHANGED_FILES=$(git show --pretty="" --name-only HEAD | head -n 25 | sed 's/^/- `/;s/$/`/' || true)
          fi

          COMMIT_LIST=$(git log $COMMIT_RANGE --no-merges --pretty=format:"- \`%h\` %s *(%cr)*" | grep -v -E "Initial commit$" || true)

          # 3. Call lightweight AI (Gemini Flash-Lite or GitHub Models free tier) with minimal token usage
          export AI_CONTEXT_CHANGELOG="$CHANGELOG_LATEST"
          export AI_CONTEXT_COMMITS="$COMMIT_LIST"
          export AI_CONTEXT_FILES="$CHANGED_FILES"
          export AI_CONTEXT_VERSION="$APP_VER"
          AI_SUMMARY=$(python3 - << 'EOF' || true
          import os, json, urllib.request

          ver = os.environ.get("AI_CONTEXT_VERSION", "1.2.0")
          # Truncate context to keep input tokens ultra-low (<200 tokens)
          changelog = os.environ.get("AI_CONTEXT_CHANGELOG", "").strip()[:700]
          commits = os.environ.get("AI_CONTEXT_COMMITS", "").strip()[:400]
          files = os.environ.get("AI_CONTEXT_FILES", "").strip()[:300]

          prompt = (
              f"Tóm tắt ngắn gọn 3-4 gạch đầu dòng Tiếng Việt về bản cập nhật APK v{ver}:\n"
              f"{changelog}\n{commits}\n{files}"
          )

          gemini_key = os.environ.get("GEMINI_API_KEY", "").strip()
          gh_token = os.environ.get("GITHUB_TOKEN", "").strip()
          result_text = ""

          if gemini_key and gemini_key != "MY_GEMINI_API_KEY":
              try:
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-preview:generateContent?key={gemini_key}"
                  payload = {
                      "contents": [{"parts": [{"text": prompt}]}],
                      "generationConfig": {
                          "temperature": 0.3,
                          "maxOutputTokens": 200
                      }
                  }
                  req = urllib.request.Request(
                      url,
                      data=json.dumps(payload).encode("utf-8"),
                      headers={"Content-Type": "application/json"},
                      method="POST"
                  )
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      result_text = data["candidates"][0]["content"]["parts"][0]["text"].strip()
              except Exception:
                  pass

          if not result_text and gh_token:
              try:
                  url = "https://models.inference.ai.azure.com/chat/completions"
                  payload = {
                      "model": "gpt-4o-mini",
                      "messages": [
                          {"role": "user", "content": prompt}
                      ],
                      "temperature": 0.3,
                      "max_tokens": 200
                  }
                  req = urllib.request.Request(
                      url,
                      data=json.dumps(payload).encode("utf-8"),
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {gh_token}"
                      },
                      method="POST"
                  )
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      result_text = data["choices"][0]["message"]["content"].strip()
              except Exception:
                  pass

          if result_text:
              print(result_text)
          EOF
          )

          {
            echo "## 🎮 Bản cập nhật CloudPlay Xbox **v${APP_VER}** (\`${TAG}\`)"
            echo "> 📅 **Phát hành:** ${BUILD_DATE}  |  📦 **Kích thước APK:** \`${APK_SIZE}\`  |  🔢 **Version Code:** \`#${APP_CODE}\`  |  🔖 **Commit:** \`${LATEST_HASH}\`"
            echo ""
            if [ -n "$AI_SUMMARY" ]; then
              echo "### ✨ Tóm tắt bản cập nhật (Mô tả bởi AI)"
              printf "%s\n\n" "$AI_SUMMARY"
              echo "---"
            fi
            if [ -n "$CHANGELOG_LATEST" ]; then
              printf "%s\n\n" "$CHANGELOG_LATEST"
            fi
            if [ -n "$COMMIT_LIST" ]; then
              echo "### 🕒 Lịch sử Commit trong đợt cập nhật này"
              printf "%s\n\n" "$COMMIT_LIST"
            fi
            if [ -n "$DIFF_STAT" ] || [ -n "$CHANGED_FILES" ]; then
              echo "<details><summary>📂 <b>Chi tiết các file mã nguồn đã thay đổi (${COMPARE_SUBTITLE})</b></summary>"
              echo ""
              [ -n "$DIFF_STAT" ] && echo "**Tổng quan:** \`${DIFF_STAT}\`" && echo ""
              [ -n "$CHANGED_FILES" ] && printf "%s\n" "$CHANGED_FILES"
              echo "</details>"
              echo ""
            fi
            echo "---"
            echo "### 📥 Tải về & Cài đặt đè trực tiếp"
            echo "- **File APK bản cập nhật này:** Chọn **`${APK_TAGGED_NAME}`** (hoặc **`${APK_VER_NAME}`**) tại mục **Assets** bên dưới."
            echo "- **Cài đặt đè không mất dữ liệu:** APK được ký bằng chữ ký đồng nhất — cài đặt đè trực tiếp lên bản cũ mà không cần gỡ ứng dụng."
            echo "- **SHA-256:** \`${APK_SHA256}\`"
          } > release-output/RELEASE_NOTES.md

          cat release-output/RELEASE_NOTES.md

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CloudPlay-Xbox-APK
          path: |
            release-output/*.apk
            release-output/RELEASE_NOTES.md
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        continue-on-error: true
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body_path: release-output/RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            release-output/CloudPlay-Xbox-${{ steps.release_info.outputs.tag_name }}.apk
            release-output/CloudPlay-Xbox-v*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
